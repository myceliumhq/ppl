packages:
  - "."

# @google/genai, protobufjs, tree-sitter-bash come from the `openclaw`
# peerDependency's own dependency tree (resolved locally for typechecking
# via autoInstallPeers, even though this package never imports openclaw at
# runtime). esbuild is pulled in via vitest. sqlite-vec ships a platform-
# specific native binary for @myceliumhq/index's vector store; onnxruntime-
# node/sharp are @huggingface/transformers' native deps for @myceliumhq/
# embed's optional local embedding provider.
allowBuilds:
  "@google/genai": true
  esbuild: true
  onnxruntime-node: true
  openclaw: true
  protobufjs: true
  sharp: true
  sqlite-vec: true
  tree-sitter-bash: true

minimumReleaseAgeExclude:
  - '@myceliumhq/dev-config@0.1.0'
  - '@myceliumhq/embed@0.1.0'
  - '@myceliumhq/index@0.1.0'
  - '@myceliumhq/mcp@0.1.0'
  - '@myceliumhq/toolkit@0.1.0'

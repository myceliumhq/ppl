packages:
  - "."

# esbuild is pulled in via vitest. sqlite-vec ships a platform-specific
# native binary for @myceliumhq/index's vector store; onnxruntime-node/
# sharp/protobufjs are @huggingface/transformers' (and its onnxruntime
# dependency's) native deps for @myceliumhq/embed's optional local
# embedding provider.
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  sqlite-vec: true

minimumReleaseAgeExclude:
  - '@myceliumhq/dev-config@0.1.0'
  - '@myceliumhq/index@0.1.0 || 1.1.1'
  - '@myceliumhq/mcp@0.1.0'
  - '@myceliumhq/toolkit@0.1.0'
  - '@myceliumhq/semanticd@1.1.0'
  - '@myceliumhq/embed@0.1.0 || 1.0.0'

# Pin vulnerable Zod 4 resolutions to a patched, compatible release.
# All current AI SDK/MCP peer ranges accept this Zod 4 release.
overrides:
  'zod@>=4.0.0 <4.6.6': '4.6.7'

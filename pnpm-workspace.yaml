packages:
  - "."

# esbuild is pulled in via vitest. sqlite-vec ships a platform-specific
# native binary for @myceliumhq/index's vector store; onnxruntime-node/
# sharp/protobufjs are @huggingface/transformers' (and its onnxruntime
# dependency's) native deps for @myceliumhq/embed's optional local
# embedding provider.
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  sqlite-vec: true

minimumReleaseAgeExclude:
  - '@myceliumhq/dev-config@0.1.0'
  - '@myceliumhq/embed@0.1.0'
  - '@myceliumhq/index@0.1.0'
  - '@myceliumhq/mcp@0.1.0'
  - '@myceliumhq/toolkit@0.1.0'
